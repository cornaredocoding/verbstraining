server:
  port: 8080

verbflash:
  # seconds available to say the answer (can also be overridden from the command line:
  #   --verbflash.answer-timeout-seconds=15)
  answer-timeout-seconds: 10
  # verbs file; to use an external one: file:/path/to/verbs.csv
  verbs-file: classpath:verbs.csv
  # probability that the prompt is in Italian (and the answer in English)
  italian-to-english-ratio: 0.5
  # file where statistics are stored (reset them from the Statistics section of the page)
  stats-file: data/stats.json
